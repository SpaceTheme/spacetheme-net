# API proxy for /artworks/ (Steam Web API + byte ranges of the Steam-Custom-Artworks grid.zip).
# The Steam API key stays on the server, the browser only talks to /api/... (no CORS problems).
# Get a key at https://steamcommunity.com/dev/apikey
#
# With Docker: see docker-compose.yml in this folder, start.sh fills in ${STEAM_API_KEY} from nginx/.env.
#
# Without Docker: copy this file OUT of the web root (otherwise the key could be downloaded
# under /nginx/api.conf), replace ${STEAM_API_KEY} with your key and include it inside the
# server { } block of the website:
#
#     include /etc/nginx/snippets/spacetheme-api.conf;
#
# The rate limit zones (spacetheme_steam, spacetheme_artworks, spacetheme_conn) and the
# cache spacetheme_og are defined in site.conf.

# Needed because proxy_pass uses variables below (the IP of your router works as well)
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 10s;




# Steam Web API ---------------------------------------------------------------

# Owned games of a SteamID64 (game details of the profile have to be public)
location = /api/steam/owned-games {
    limit_req zone=spacetheme_steam burst=20 nodelay;
    if ($arg_steamid !~ "^[0-9]{17}$") { return 400; }
    proxy_pass https://api.steampowered.com/IPlayerService/GetOwnedGames/v1/?key=${STEAM_API_KEY}&steamid=$arg_steamid&include_appinfo=true&include_played_free_games=true;
    proxy_ssl_server_name on;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Location;   # a redirect from Steam would contain the url with the key
}

# Name + avatar of a SteamID64
location = /api/steam/summary {
    limit_req zone=spacetheme_steam burst=20 nodelay;
    if ($arg_steamid !~ "^[0-9]{17}$") { return 400; }
    proxy_pass https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v2/?key=${STEAM_API_KEY}&steamids=$arg_steamid;
    proxy_ssl_server_name on;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Location;   # a redirect from Steam would contain the url with the key
}

# Custom profile URL (steamcommunity.com/id/<name>) -> SteamID64
location = /api/steam/resolve {
    limit_req zone=spacetheme_steam burst=20 nodelay;
    if ($arg_vanityurl !~ "^[A-Za-z0-9_-]{2,32}$") { return 400; }
    proxy_pass https://api.steampowered.com/ISteamUser/ResolveVanityURL/v1/?key=${STEAM_API_KEY}&vanityurl=$arg_vanityurl;
    proxy_ssl_server_name on;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Location;   # a redirect from Steam would contain the url with the key
}




# GitHub preview cards --------------------------------------------------------

# GitHub's generated social preview (repos without a custom one) is rate limited per IP.
# nginx fetches each card at most once a day and serves its copy to all visitors; if GitHub
# refuses (429) or is down, the last copy is used. Only repos of SpaceTheme.
location ~ "^/api/og/SpaceTheme/(?<og_repo>[A-Za-z0-9._-]{1,100})$" {
    proxy_pass https://opengraph.githubassets.com/1/SpaceTheme/$og_repo;
    proxy_ssl_server_name on;
    proxy_cache spacetheme_og;
    proxy_cache_key $og_repo;
    proxy_cache_valid 200 1d;
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Content-Security-Policy;
    add_header Cache-Control "public, max-age=86400";   # only on success, never cache a 429
    add_header X-Content-Type-Options "nosniff" always;
}




# Steam-Custom-Artworks -----------------------------------------------------

# grid.zip of a release: /api/artworks/<tag>/grid.zip (tag from data/artworks.json) or
# /api/artworks/latest/grid.zip. The page only requests byte ranges (the files of the selected
# games), so users never download the whole 380 MB file.
# GitHub answers with redirects to a signed storage URL, nginx follows them itself
# because the browser would be blocked by CORS.
# Only byte ranges are accepted, so nobody can download the whole file through the NAS.
location = /api/artworks/latest/grid.zip {
    limit_req zone=spacetheme_artworks burst=300 delay=60;
    limit_conn spacetheme_conn 8;
    if ($http_range !~ "^bytes=[0-9]+-[0-9]+$") { return 416; }
    proxy_pass https://github.com/SpaceTheme/Steam-Custom-Artworks/releases/latest/download/grid.zip;
    proxy_ssl_server_name on;
    proxy_buffering off;
    proxy_buffer_size 64k;        # GitHub's redirect headers are bigger than the default 4k
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    proxy_intercept_errors on;
    recursive_error_pages on;
    error_page 301 302 303 307 308 = @artworks_redirect;
}

location ~ "^/api/artworks/(?<artworks_tag>[A-Za-z0-9._-]{1,64})/grid\.zip$" {
    limit_req zone=spacetheme_artworks burst=300 delay=60;
    limit_conn spacetheme_conn 8;
    if ($http_range !~ "^bytes=[0-9]+-[0-9]+$") { return 416; }
    proxy_pass https://github.com/SpaceTheme/Steam-Custom-Artworks/releases/download/$artworks_tag/grid.zip;
    proxy_ssl_server_name on;
    proxy_buffering off;
    proxy_buffer_size 64k;        # GitHub's redirect headers are bigger than the default 4k
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    proxy_intercept_errors on;
    recursive_error_pages on;
    error_page 301 302 303 307 308 = @artworks_redirect;
}

location @artworks_redirect {
    set $artworks_location $upstream_http_location;
    proxy_pass $artworks_location;
    proxy_ssl_server_name on;
    proxy_buffering off;
    proxy_buffer_size 64k;        # GitHub's redirect headers are bigger than the default 4k
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    proxy_intercept_errors on;
    recursive_error_pages on;
    error_page 301 302 303 307 308 = @artworks_redirect;
    proxy_hide_header Content-Disposition;
    proxy_hide_header Set-Cookie;
}
