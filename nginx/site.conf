# nginx server for the website + API proxy, used by docker-compose.yml (via start.sh).
# On a NAS without Docker you can copy the parts you need into your own config
# (everything above "server {" belongs into the http { } block, the rest into your server { } block).
# Changes to this file are picked up automatically after a git pull (start.sh reloads nginx).

# Only pages can be opened directly in the browser.
# Browsers send Sec-Fetch-Dest with every request: "document" when the user opens a url
# (address bar, link, bookmark), "style" / "script" / "image" / "empty" (fetch) when one of
# our pages loads the file. So css, js, json, images, html snippets and the API still work for
# the pages, but opening them directly shows the 403 page.
# This only hides the files from normal visitors - the browser dev tools or curl still get them,
# a browser needs these files to show the website.
map "$http_sec_fetch_dest:$uri" $spacetheme_blocked {
    volatile;                                     # re-check after the internal redirect to the error page
    default                                   0;
    "~^document:/components/errors/"          0;  # error pages (internal redirect by error_page)
    "~^document:/(robots\.txt|sitemap\.xml)$"  0;  # for search engines, may be opened directly
    "~^document:/components/"                 1;  # html snippets, only loaded by the pages
    "~^document:/api/"                        1;  # API answers are only for the pages
    "~^document:.*(/|\.html)$"                0;  # pages: /, /themes/, /artworks/, ...index.html
    "~^document:[^.]*$"                       0;  # urls without extension (/themes -> /themes/ redirect)
    "~^(document|iframe|frame|embed|object):" 1;  # every other file opened directly
}

# Caching:
# - Browser (Cache-Control): always revalidates (cheap 304), so a new deploy is visible right away
#   and a file the page loaded can't be shown from the browser cache when its url is opened directly.
# - Cloudflare (Cloudflare-CDN-Cache-Control, only read by Cloudflare, not sent to visitors):
#   keeps css/js/data/images at the edge, so they load fast. Opening them directly is blocked by
#   the Cloudflare WAF rule (runs before the cache) and by $spacetheme_blocked above (without Cloudflare).
map $uri $spacetheme_cache {
    volatile;
    default                   "no-cache";
    "~^/components/errors/"   "no-store";
}
map $uri $spacetheme_cdn_cache {
    volatile;
    default                                        "";
    "~^/components/errors/"                        "";
    "~\.(css|js)$"                                 "max-age=300";
    "~^/(data|components)/"                         "max-age=300";
    "~\.(svg|png|webp|jpe?g|ico|webm|woff2?)$"     "max-age=86400";
}

# Rate limits, so nobody can use up the Steam API key quota or the bandwidth of the NAS
limit_req_zone  $binary_remote_addr zone=spacetheme_steam:10m    rate=30r/m;
limit_req_zone  $binary_remote_addr zone=spacetheme_artworks:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=spacetheme_kofi:1m      rate=10r/m;
limit_conn_zone $binary_remote_addr zone=spacetheme_conn:10m;

# Cache for GitHub's generated preview cards (/api/og/..., see api.conf)
proxy_cache_path /var/cache/nginx/spacetheme_og levels=1:2 keys_zone=spacetheme_og:1m max_size=50m inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;

    root ${SITE_ROOT};   # filled in by start.sh
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 64k;

    # Real visitor IP when a reverse proxy / tunnel in the local network (or Docker) forwards
    # the requests, otherwise every visitor would share the rate limit of the proxy.
    # Requests from the internet can't fake it, only these private addresses are trusted.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;
    limit_conn_status 429;

    # Security headers (always = also on error pages). Inline scripts are not allowed, inline
    # styles are needed for the rendered GitHub readmes. HSTS belongs into your HTTPS proxy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https://raw.githubusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $spacetheme_cache always;
    add_header Cloudflare-CDN-Cache-Control $spacetheme_cdn_cache;

    # Opened directly: "Access denied" page (403.html). Repo internals below stay 404.
    if ($spacetheme_blocked) {
        return 403;
    }

    # Repo internals are not part of the website (.git, .github, the nginx config, ...)
    location ~ /\. { return 404; }
    location ^~ /nginx/ { return 404; }
    location ~ ^/(README\.md|LICENSE|.*\.(md|yml|yaml|sh|mjs|conf|lock|env))$ { return 404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Error pages in the style of the website (components/errors/<code>.html),
    # only shown by nginx itself, not reachable under their own url
    error_page 400 /components/errors/400.html;
    error_page 401 /components/errors/401.html;
    error_page 403 /components/errors/403.html;
    error_page 404 /components/errors/404.html;
    error_page 405 /components/errors/405.html;
    error_page 408 /components/errors/408.html;
    error_page 413 /components/errors/413.html;
    error_page 429 /components/errors/429.html;
    error_page 500 /components/errors/500.html;
    error_page 502 /components/errors/502.html;
    error_page 503 /components/errors/503.html;
    error_page 504 /components/errors/504.html;
    location ^~ /components/errors/ {
        internal;
    }

    # Ko-fi webhook -> kofi-relay container (resolved at request time via Docker's DNS,
    # so nginx also starts when the relay isn't running)
    location = /api/kofi/webhook {
        limit_except POST { deny all; }
        limit_req zone=spacetheme_kofi burst=5 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $kofi_relay http://kofi-relay:8787;
        proxy_pass $kofi_relay;
    }

    include /etc/nginx/spacetheme/api.conf;
}
