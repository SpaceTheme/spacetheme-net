<a class="theme-card {{classes}}" href="{{href}}">
    <div class="preview">
        {{{preview}}}
        <div class="badges">{{{badges}}}</div>
    </div>
    <div class="body">
        <p class="card-label">Featured</p>
        <h2>{{name}}</h2>
        <p class="description">{{description}}</p>
        <div class="tags">{{{tags}}}</div>
        <div class="meta">{{{meta}}}</div>
        <span class="card-cta">View theme{{{iconArrow}}}</span>
    </div>
</a>
