name: Update Data

on:
  schedule:
    # every hour (minute 17: GitHub delays runs at :00 when many workflows start at once)
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'data/themes.json'
      - '.github/scripts/update-data.mjs'
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # GH_TOKEN needs push access to the theme repos for clone stats,
      # without it the default token is used (no clone stats)
      - name: Update data
        run: node .github/scripts/update-data.mjs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Commit changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add data/stats.json data/details data/artworks.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update: theme data"
            for i in {1..10}; do
              git pull --rebase origin main && git push && break || sleep 10
            done
          fi
